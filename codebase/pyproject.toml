[project]
name = "flare-automsc-pipeline"
version = "1.2.1"
description = "Dataset-agnostic FLARE 2026 AutoMSC segmentation and classification pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "acvl-utils>=0.2.6,<0.3",
    "batchgenerators>=0.25.1",
    "batchgeneratorsv2>=0.3.2",
    "blosc2>=3.3.2",
    "dynamic-network-architectures>=0.4.4,<0.5",
    "einops>=0.8",
    "graphviz>=0.20",
    "imagecodecs>=2024.1",
    "matplotlib>=3.8",
    "monai>=1.4,<2",
    "nibabel>=5.2",
    "numpy==1.26.4",
    "pandas>=2.1,<3",
    "requests>=2.31",
    "scikit-image>=0.22",
    "scikit-learn==1.5.2",
    "seaborn>=0.13",
    "scipy==1.13.1",
    "SimpleITK>=2.2.1",
    "timm>=1.0",
    "tifffile>=2024.1",
    "torch==2.8.0",
    "torchmetrics>=1.4",
    "torchvision==0.23.0",
    "triton==3.4.0; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "tqdm>=4.66",
    "wandb>=0.17",
    "yacs>=0.1.8",
]

[project.scripts]
automsc = "automsc_pipeline.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["automsc_pipeline*", "nnunetv2*"]
exclude = ["nnunetv2.tests*"]

# CUDA 12.8 wheels include kernels for NVIDIA Blackwell GPUs (sm_120).
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cu129", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cu129", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
triton = { index = "pytorch-packages", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-packages"
url = "https://download.pytorch.org/whl"
explicit = true
